[project]
name = "family-dashboard-backend"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.140.7",
    # Pinned explicitly rather than left to fastapi, which only asks for
    # starlette>=0.46.0 — a range that still admits every version affected by
    # CVE-2026-48710 (host-header auth bypass, fixed in 1.0.1).
    "starlette>=1.0.1",
    "uvicorn[standard]>=0.51.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "caldav>=3.2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "httpx>=0.28.1",
    "ruff>=0.16.0",
    "mutmut>=3.6.0",
]

[tool.setuptools.packages.find]
include = ["routers*", "services*"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mutmut]
paths_to_mutate = ["routers/travel.py", "routers/weather.py", "routers/calendar.py", "scheduler.py", "services/commute_schedule.py"]
tests_dir = ["tests/"]
also_copy = ["main.py", "config.py", "conftest.py", "routers/__init__.py", "routers/calendar.py", "services/__init__.py", "commute-schedule.json"]
